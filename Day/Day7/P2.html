<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform: translate | rotate</title>
    <style>
        .box{
            transform: translateX(50px);
            background-color: hwb(323 88% 3%);
            border: 2px solid black;
        }
        .box1{
            transform: translateY(20px);
            background-color: #bd7197;
            border: 2px solid black;
        }
        .box2{
            transform: translate(60px 50px);
            background-color: hsl(321, 54%, 50%);
            border: 2px solid black;
        }
        .box3{
            transform: rotateZ(180deg);
            background-color: hsl(320, 86%, 29%);
            border: 2px solid black;
        }
         .box4{
            margin-left: 40px;
            /* scale, scaleX, scaleY, scale3d */
            transform: scale3d(1.2, 1.2, 1);
            width: 100px;
            height: 100px;
            background-color: rgb(125, 5, 57);
            border: 2px solid black;
            margin-top: 20px;
         }
         .box5{
            width: 200px;
            height: 100px;
            background-color: rgb(244, 143, 195);
            border: 2px solid black;
            transform: skew(5deg, 10deg);
        }
    </style>
</head>
<body>
    <p>CSS Transform: property visually moves, rotate, enlarge, shrink. It 2d or 3d</p>
    <!-- Syntax -->
    tranform: transform-function(value)

    <div class="box">
        Box
    </div>
    
    <div class="box2">
        Box 2
    </div>

    <div class="box1">
        Box 1
    </div>
<br>
    <div class="box3">
        Box 3
    </div>
    <div class="box4">
        Box 4
    </div>

    <br>
    <div class="box5">
        Box 5
    </div>

    <!-- translateX, translateY, translate | rotate(+/-) rotateX -->
</body>
</html>
